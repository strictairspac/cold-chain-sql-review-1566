name: payment-claims
services:
  db:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-payment-claims}-db
    environment:
      POSTGRES_DB: payment_claims
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_demo_4101}
    ports: ["${DB_PORT:-17740}:5432"]
    volumes: ["db-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d payment_claims"]
      interval: 3s
      timeout: 3s
      retries: 30
  backend:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-payment-claims}-backend
    environment:
      DATABASE_URL: postgresql+psycopg2://app:${POSTGRES_PASSWORD:-local_demo_4101}@db/payment_claims
      JWT_SECRET: ${JWT_SECRET:-local-demo-payment-claims-change-before-production-20261120}
      SEED_DEMO: ${SEED_DEMO:-true}
    ports: ["${BACKEND_PORT:-19240}:8000"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 30
  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-payment-claims}-frontend
    ports: ["${FRONTEND_PORT:-18240}:80"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  db-data:
